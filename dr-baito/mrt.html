<!doctype html><html lang="ja"><head><title>MRT WORKで開く｜医師バイトBot</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="icon" href="../favicon.png" sizes="32x32"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  /* LINE の求人カード「MRTアプリで開く」から開く中継ページ。
     LINE から直接 Safari で MRT のリンクを開くとアプリに渡らず App Store に回るため、ここで1回押してもらう
     （別のサイトのページから押したリンクなら、iPhone がアプリで開く＝ユニバーサルリンク）。何も保存・送信しない */
  :root { --key:#3F6F8F; --key-dark:#2F5670; --key-50:#EAF1F5; --ink:#1a1a1a; --sub:#4d4d4d; --line:#cccccc; --bg:#f2f2f2; --yellow:#ffd43d; }
  * { box-sizing:border-box; }
  body { margin:0; word-break:auto-phrase; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; color:var(--ink); background:#fff; line-height:1.8; font-size:16px; }
  a:focus-visible { outline:4px solid #000; outline-offset:2px; box-shadow:0 0 0 2px var(--yellow); border-radius:4px; }
  main { max-width:480px; margin:0 auto; padding:40px 16px 32px; }
  h1 { font-size:22px; line-height:1.5; margin:0 0 4px; }
  .id { color:var(--sub); margin:0 0 24px; }
  .btn { display:block; text-align:center; text-decoration:none; font-weight:700; border-radius:12px; padding:16px; font-size:18px; }
  .main { background:var(--key); color:#fff; }
  .main:active { background:var(--key-dark); }
  .help { margin:28px 0 0; padding:14px 16px; background:var(--bg); border-radius:8px; font-size:15px; }
  .help p { margin:0 0 8px; }
  .help a { color:var(--key); text-underline-offset:3px; }
  .help ul { margin:0; padding-left:1.2em; } .help li { margin:4px 0; }
  .hint { color:var(--sub); font-size:14px; }
  footer { max-width:480px; margin:0 auto; padding:0 16px 28px; font-size:13px; color:var(--sub); }
</style>
</head><body>
<main>
  <h1 id="title">MRT WORK で求人を開きます</h1>
  <p class="id" id="idline"></p>
  <div id="ok" hidden>
    <a class="btn main" id="open">MRT WORK アプリで開く</a>
    <div class="help">
      <p>アプリが開かないときは</p>
      <ul>
        <li><a id="scheme">別の方法でアプリを開く</a><br><span class="hint">「開きますか？」と出たら「開く」</span></li>
        <li><a id="web">ブラウザで見る（MRT の会員ページ）</a></li>
        <li><a id="store">MRT WORK を入れる</a></li>
      </ul>
    </div>
  </div>
  <p id="bad" hidden>案件番号が読み取れませんでした。LINE に戻って、もう一度カードのボタンを押してください。</p>
</main>
<footer>医師バイトBot（<a href="./">合同会社鈴木医工</a>）<br>このページは何も保存・送信しません。</footer>
<script>
  const id = new URLSearchParams(location.search).get('id') || '';
  if (/^\d{1,10}$/.test(id)) {
    const path = `doctors/doctor_spots/${id}?type=spot&id=${id}`; // MRT のメールのリンク（mrtwork.go.link）と同じ行き先
    document.getElementById('idline').textContent = `MRT 案件番号 ${id}`;
    document.getElementById('open').href = `https://mrtwork.go.link/${path}`;
    document.getElementById('scheme').href = `mrtwork://${path}`;
    document.getElementById('web').href = `https://medical.medrt.com/${path}`;
    document.getElementById('store').href = /Android/i.test(navigator.userAgent)
      ? 'https://play.google.com/store/apps/details?id=com.medrt.mrt_work' : 'https://apps.apple.com/app/id1609358025';
    document.getElementById('ok').hidden = false;
  } else {
    document.getElementById('bad').hidden = false;
  }
</script>
</body></html>
